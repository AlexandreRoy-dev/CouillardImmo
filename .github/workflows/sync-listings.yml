name: Synchroniser les propriétés

on:
  schedule:
    - cron: "17 10 * * *"   # tous les jours vers 5 h 17 ou 6 h 17, heure de Toronto
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-listings
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4==4.12.3
      - run: python scripts/sync_listings.py
      - name: Commit si changement
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Mise à jour automatique des propriétés"
            git push
          else
            echo "Aucun changement"
          fi
